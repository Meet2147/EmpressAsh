# Render Blueprint: one small web service ($7/month Starter) with a 1 GB disk for the database.
services:
  - type: web
    name: empressash
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /healthz
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATA_DIR
        value: /var/data
      - key: SECRET_KEY
        generateValue: true
      - key: SITE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DODO_PAYMENTS_API_KEY
        sync: false
      - key: DODO_PAYMENTS_WEBHOOK_KEY
        sync: false
      - key: DODO_PAYMENTS_MODE
        value: test_mode
      - key: DODO_PRODUCT_INR
        sync: false
      - key: DODO_PRODUCT_USD
        sync: false
      - key: LIVE_READINGS_OPEN
        value: "false"
      - key: CAL_LINK
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: CONTACT_PHONE
        sync: false
      - key: CONTACT_WHATSAPP
        sync: false
      - key: INSTAGRAM_URL
        sync: false
      - key: YOUTUBE_URL
        sync: false
      - key: TELEGRAM_URL
        sync: false
